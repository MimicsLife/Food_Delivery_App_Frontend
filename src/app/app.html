<div class="shell">
  <header class="shell__header">
    <a routerLink="/" class="shell__brand">Dostava</a>

    <nav class="shell__nav">
      <a routerLink="/restorani" routerLinkActive="is-active">Restorani</a>
      <a routerLink="/korpa" routerLinkActive="is-active">
        Korpa
        @if (brojUKorpi() > 0) {
          <span class="shell__badge">{{ brojUKorpi() }}</span>
        }
      </a>

      @if (auth.isLoggedIn()) {
        <a routerLink="/porudzbine" routerLinkActive="is-active">Porudžbine</a>
        <a routerLink="/korisnici" routerLinkActive="is-active">Korisnici</a>
      }
    </nav>

    <div class="shell__account">
      @if (auth.isLoggedIn()) {
        <span class="shell__user">{{ auth.currentUser() }}</span>
        <button type="button" class="btn btn--ghost btn--sm" (click)="odjaviSe()">Odjava</button>
      } @else {
        <a class="btn btn--ghost btn--sm" routerLink="/login">Prijava</a>
        <a class="btn btn--primary btn--sm" routerLink="/registracija">Registracija</a>
      }
    </div>
  </header>

  <main class="shell__main">
    <router-outlet />
  </main>
</div>
